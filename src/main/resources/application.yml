server:
  port: ${SERVER_PORT:8260}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ms-playlist
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:playlist_db}
    username: ${DB_USER:styleradar_user}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:}

styleradar:
  rabbitmq:
    exchanges:
      main: styleradar.exchange
      dlx: styleradar.dlx
    queues:
      prenda-retirada: styleradar.playlist.prenda-retirada.q
      dlq: styleradar.playlist.dlq
    routing-keys:
      prenda-retirada: styleradar.catalogo.prenda.retirada

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health, info
